services:
  etl-stable:
    container_name: etl-stable
    image: oksii/etlegacy:stable
    env_file: .env
    environment:
      - 'SERVER_HOSTNAME=ETLDocker Stable' 
    volumes:
      - ./maps:/maps
      # ETLTV demos (etlutil tv start / rcon etltv start)
      # - ./tvdemos:/legacy/homepath/tvdemos
    ports:
      - '27960:27960/udp'
      # ETLTV spectator relay, with ETLTV_PUBLIC=true
      # - '27961:27961/udp'
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.lifecycle.pre-update=/legacy/server/autorestart"
    stdin_open: true
    tty: true
    restart: unless-stopped

  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    env_file: .env
    command: --http-api-update --enable-lifecycle-hooks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config.json:/config.json
    environment:
      - WATCHTOWER_HTTP_API_TOKEN=$WATCHTOWER_API_TOKEN
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - 8080:8080